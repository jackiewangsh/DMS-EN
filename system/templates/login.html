<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DMS Document Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #060d18 0%, #0a1628 50%, #0d1f3c 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }
        .glow-text {
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }
        .font-tech {
            font-family: 'Courier New', 'Consolas', monospace;
            letter-spacing: 2px;
        }
        .login-card {
            background: rgba(15, 35, 64, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 212, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 60px rgba(0, 212, 255, 0.1);
            border-radius: 16px;
            padding: 32px;
            position: relative;
            z-index: 10;
        }
        .tech-btn {
            background: linear-gradient(135deg, #4facfe, #00d4ff);
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            color: white;
            font-weight: 600;
        }
        .tech-btn:hover {
            box-shadow: 0 6px 25px rgba(0, 212, 255, 0.5);
            transform: translateY(-1px);
        }
        .input-glow:focus {
            box-shadow: 0 0 0 2px rgba(0, 212, 255, 0.3);
            outline: none;
            border-color: rgba(0, 212, 255, 0.5) !important;
        }
        .error-msg {
            animation: shake 0.4s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .login-container {
            width: 100%;
            max-width: 448px;
            padding: 16px;
            position: relative;
            z-index: 10;
        }
        .decoration-circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            pointer-events: none;
        }
        .btn-icon {
            display: inline-block;
            width: 16px;
            height: 16px;
            margin-right: 8px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Decorative circle -->
        <div class="decoration-circle" style="top: -80px; left: -80px; width: 240px; height: 240px; background: radial-gradient(circle, rgba(0,212,255,0.8) 0%, transparent 70%);"></div>
        <div class="decoration-circle" style="bottom: -40px; right: -40px; width: 160px; height: 160px; background: radial-gradient(circle, rgba(79,172,254,0.8) 0%, transparent 70%);"></div>

        <div class="login-card">
            <!-- Logo -->
            <div style="text-align: center; margin-bottom: 32px;" id="loginLogoSection">
                <div id="loginLogoContainer" style="display: inline-flex; align-items: center; justify-content: center; width: 128px; height: 128px; border-radius: 16px; margin-bottom: 16px; background: linear-gradient(135deg, #4facfe, #00d4ff); box-shadow: 0 0 30px rgba(0,212,255,0.4);">
                    <span id="loginLogoIcon" style="font-size: 48px; color: white;">
                        <!-- Stacked icon SVG -->
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                            <polyline points="2 17 12 22 22 17"></polyline>
                            <polyline points="2 12 12 17 22 12"></polyline>
                        </svg>
                    </span>
                    <img id="loginLogoImg" src="" alt="Logo" style="display: none; max-width: 100%; max-height: 100%; object-fit: contain; padding: 8px;">
                </div>
                <h1 class="font-tech glow-text" style="font-size: 32px; font-weight: bold; color: #00d4ff;">DMS</h1>
                <p style="font-size: 14px; margin-top: 4px; color: #94a3b8;">Documents Management System</p>
                <p id="loginSubTitle" style="font-size: 12px; margin-top: 2px; color: #64748b;">Document Management System</p>
            </div>

            <!-- ErrorPrompt -->
            {% if error %}
            <div class="error-msg" style="margin-bottom: 20px; display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 8px; font-size: 14px; background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                {{ error }}
            </div>
            {% endif %}


            

            <!-- LoginForm -->
            <form method="POST" action="{{ url_for('login') }}">
                <div style="display: flex; flex-direction: column; gap: 16px;">
                    <div>
                        <label style="display: block; font-size: 12px; font-weight: 500; margin-bottom: 6px; color: #94a3b8;">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px; vertical-align: middle;">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            Username
                        </label>
                        <input type="text" name="username"
                               class="input-glow"
                               style="width: 100%; padding: 12px 16px; border-radius: 8px; font-size: 14px; background: rgba(0,0,0,0.3); border: 1px solid rgba(0,212,255,0.2); color: #e2e8f0; outline: none;"
                               placeholder="Please enter" required autofocus>
                    </div>
                    <div>
                        <label style="display: block; font-size: 12px; font-weight: 500; margin-bottom: 6px; color: #94a3b8;">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px; vertical-align: middle;">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            Password
                        </label>
                        <input type="password" name="password"
                               class="input-glow"
                               style="width: 100%; padding: 12px 16px; border-radius: 8px; font-size: 14px; background: rgba(0,0,0,0.3); border: 1px solid rgba(0,212,255,0.2); color: #e2e8f0; outline: none;"
                               placeholder="Please enter" required>
                    </div>
                    <button type="submit" class="tech-btn" style="width: 100%; padding: 12px; border-radius: 8px; font-size: 14px; letter-spacing: 2px;">
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                            <polyline points="10 17 15 12 10 7"></polyline>
                            <line x1="15" y1="12" x2="3" y2="12"></line>
                        </svg>
                        LOGIN
                    </button>
                    <div style="text-align: center; margin-top: 8px;">
                        <a href="#" onclick="showForgotPassword(); return false;" style="font-size: 12px; color: #64748b; text-decoration: none; transition: color 0.3s;" onmouseover="this.style.color='#00d4ff'" onmouseout="this.style.color='#64748b'">Forgot Password?</a>
                    </div>
                </div>
            </form>

            <!-- PromptInformation -->
            <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(0,212,255,0.15); text-align: center;">
                <p style="font-size: 12px; color: #475569;">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px; vertical-align: middle;">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>
                    
                </p>
            </div>
        </div>

        <p style="text-align: center; font-size: 12px; margin-top: 24px; color: #334155;">
            Document Management System Designed by JW &copy;2026
        </p>
    </div>
    
    <!-- Forgot PasswordDialog -->
    <div id="forgotPasswordModal" style="display:none; position:fixed; inset:0; z-index:100; background:rgba(0,0,0,0.7); align-items:center; justify-content:center;">
        <div class="login-card" style="max-width:400px; width:90%; margin:auto; margin-top:30vh;">
            <h3 class="font-tech glow-text" style="font-size: 18px; text-align:center; margin-bottom: 20px; color:#00d4ff;">Forgot Password</h3>
            <p style="font-size:13px; color:#94a3b8; text-align:center; margin-bottom:16px;">Please enterWhen You Register usingEmail Address，System Will Send Reset Password Email。</p>
            <div style="margin-bottom:16px;">
                <input type="email" id="forgotEmail" placeholder="Please enterEmail Address"
                       class="input-glow"
                       style="width:100%; padding:12px 16px; border-radius:8px; font-size:14px; background:rgba(0,0,0,0.3); border:1px solid rgba(0,212,255,0.2); color:#e2e8f0; outline:none;">
            </div>
            <div id="forgotMsg" style="display:none; margin-bottom:12px; padding:10px; border-radius:8px; font-size:13px; text-align:center;"></div>
            <div style="display:flex; gap:12px;">
                <button onclick="closeForgotPassword()" style="flex:1; padding:10px; border-radius:8px; font-size:13px; background:rgba(100,100,100,0.2); border:1px solid rgba(100,100,100,0.3); color:#94a3b8; cursor:pointer;">Cancel</button>
                <button onclick="submitForgotPassword()" class="tech-btn" style="flex:1; padding:10px; border-radius:8px; font-size:13px;">Send Reset Email</button>
            </div>
        </div>
    </div>

    <script>
    // LoadingLogin PageTitle
    document.addEventListener('DOMContentLoaded', function() {
        // LoadingTitle
        fetch('/public/login-title')
            .then(r => r.json())
            .then(data => {
                if (data.title) {
                    document.getElementById('loginSubTitle').textContent = data.title;
                }
            })
            .catch(e => console.log('Title load failed:', e));
        
        // Check andShowCompany Logo
        fetch('/public/logo')
            .then(r => r.json())
            .then(data => {
                if (data.exists) {
                    const container = document.getElementById('loginLogoContainer');
                    const icon = document.getElementById('loginLogoIcon');
                    const img = document.getElementById('loginLogoImg');
                    
                    // HideDefault Icon，Showlogo
                    icon.style.display = 'none';
                    img.style.display = 'block';
                    img.src = '/static/logo.png?t=' + Date.now();
                    
                    // RemoveBackground style，LetlogoAuto resize
                    container.style.background = 'transparent';
                    container.style.boxShadow = 'none';
                    container.style.width = 'auto';
                    container.style.height = 'auto';
                    container.style.maxWidth = '256px';
                    container.style.maxHeight = '128px';
                    container.style.padding = '8px';
                    
                    img.style.maxWidth = '240px';
                    img.style.maxHeight = '120px';
                    img.style.objectFit = 'contain';
                    
                    // EnsureImageLoadingSuccess
                    img.onload = function() {
                        console.log('Login logo loaded successfully');
                    };
                    img.onerror = function() {
                        console.log('Login logo load failed');
                        icon.style.display = '';
                        img.style.display = 'none';
                    };
                }
            })
            .catch(e => console.log('Logo check failed:', e));
    });
    // Forgot Password
    function showForgotPassword() {
        var modal = document.getElementById('forgotPasswordModal');
        modal.style.display = 'flex';
        document.getElementById('forgotEmail').value = '';
        document.getElementById('forgotMsg').style.display = 'none';
        document.getElementById('forgotEmail').focus();
    }
    function closeForgotPassword() {
        document.getElementById('forgotPasswordModal').style.display = 'none';
    }
    function submitForgotPassword() {
        var email = document.getElementById('forgotEmail').value.trim();
        var msgEl = document.getElementById('forgotMsg');
        if (!email) {
            msgEl.style.display = 'block';
            msgEl.style.background = 'rgba(239,68,68,0.15)';
            msgEl.style.border = '1px solid rgba(239,68,68,0.3)';
            msgEl.style.color = '#fca5a5';
            msgEl.textContent = 'Please enterEmail Address';
            return;
        }
        msgEl.style.display = 'block';
        msgEl.style.background = 'rgba(0,212,255,0.1)';
        msgEl.style.border = '1px solid rgba(0,212,255,0.2)';
        msgEl.style.color = '#00d4ff';
        msgEl.textContent = 'NowAtProcess，Please wait...';
        fetch('/api/forgot-password', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email: email})
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            msgEl.style.display = 'block';
            if (data.success) {
                msgEl.style.background = 'rgba(34,197,94,0.15)';
                msgEl.style.border = '1px solid rgba(34,197,94,0.3)';
                msgEl.style.color = '#4ade80';
                msgEl.textContent = data.message;
            } else {
                msgEl.style.background = 'rgba(239,68,68,0.15)';
                msgEl.style.border = '1px solid rgba(239,68,68,0.3)';
                msgEl.style.color = '#fca5a5';
                msgEl.textContent = data.message;
            }
        })
        .catch(function(e) {
            msgEl.style.background = 'rgba(239,68,68,0.15)';
            msgEl.style.border = '1px solid rgba(239,68,68,0.3)';
            msgEl.style.color = '#fca5a5';
            msgEl.textContent = 'Request Failed，Please A bit afterRetry';
        });
    }
    // EnterKeySubmitForgot Password
    document.getElementById('forgotEmail').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); submitForgotPassword(); }
    });
    </script>
</body>
</html>
