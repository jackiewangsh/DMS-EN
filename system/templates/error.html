{% extends "base.html" %}

{% block title %}{{ error_title }} - DMS{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto mt-20">
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-8 text-center">
        <div class="mb-6">
            <svg class="w-20 h-20 mx-auto text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
            </svg>
        </div>
        
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-4">{{ error_title }}</h1>
        
        <p class="text-gray-600 dark:text-gray-400 mb-8">{{ error_message }}</p>
        
        <div class="flex justify-center gap-4">
            <a href="javascript:history.back()" class="px-6 py-3 bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors">
                BackPrevious
            </a>
            <a href="{{ url_for('dashboard') }}" class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                BackFirst
            </a>
        </div>
    </div>
</div>
{% endblock %}
