{% extends "base.html" %}
{% block content %}
<style>
/* Dropdown option style */
select option {
    background: #0f172a;
    color: #e2e8f0;
    padding: 8px;
}
</style>
<div class="mb-4">
    <a href="{{ url_for('files') }}" class="text-sm hover:opacity-80" style="color:var(--text-dim);">
        <i class="fas fa-arrow-left mr-1"></i>BackFile Management
    </a>
</div>
<div class="glass-card rounded-xl p-6 max-w-2xl">
    <h2 class="text-lg font-bold mb-5" style="color:var(--accent);">
        <i class="fas fa-cloud-upload-alt mr-2"></i>Upload File
    </h2>
    <form id="uploadForm">
        <div class="mb-4">
            <label class="block text-sm font-medium mb-2" style="color:var(--text-dim);">
                <i class="fas fa-building mr-1"></i>SelectDepartment *
            </label>
            <select name="department" id="deptSelect" required
                    class="w-full px-4 py-2.5 rounded-lg text-sm"
                    style="background:rgba(0,0,0,0.3); border:1px solid rgba(0,212,255,0.2); color:#e2e8f0; outline:none;">
                <option value="">Please selectDepartment</option>
            </select>
        </div>
        <div class="mb-4">
            <label class="block text-sm font-medium mb-2" style="color:var(--text-dim);">
                <i class="fas fa-tag mr-1"></i>Select File Type *
            </label>
            <select name="file_type" id="typeSelect" required
                    class="w-full px-4 py-2.5 rounded-lg text-sm"
                    style="background:rgba(0,0,0,0.3); border:1px solid rgba(0,212,255,0.2); color:#e2e8f0; outline:none;">
                <option value="">Please selectType</option>
            </select>
        </div>
        <div class="mb-5">
            <label class="block text-sm font-medium mb-2" style="color:var(--text-dim);">
                <i class="fas fa-paperclip mr-1"></i>Select File（Support multi-select）
            </label>
            <div class="border-2 border-dashed rounded-xl p-8 text-center cursor-pointer transition-colors"
                 id="dropZone"
                 style="border-color:rgba(0,212,255,0.3); background:rgba(0,0,0,0.1);"
                 onclick="document.getElementById('fileInput').click()">
                <i class="fas fa-cloud-upload-alt text-3xl mb-3" style="color:var(--accent);"></i>
                <div class="text-sm mb-2" style="color:var(--text-dim);">Click Or Drag File to Upload Here</div>
                <div class="text-xs" style="color:rgba(100,100,100,0.6);">Support：PDF、Word、Excel、PPT、TXT、Image、ZIP</div>
                <input type="file" id="fileInput" name="files" multiple
                       class="hidden" onchange="handleFiles(this.files)">
            </div>
            <div id="fileList" class="mt-3 space-y-2"></div>
        </div>
        <div class="flex gap-3">
            <button type="submit" class="tech-btn px-6 py-2.5 rounded-lg text-white text-sm font-semibold">
                <i class="fas fa-upload mr-2"></i>StartUpload
            </button>
            <a href="{{ url_for('files') }}" class="px-6 py-2.5 rounded-lg text-sm" style="background:rgba(100,100,100,0.2); color:var(--text-dim);">Cancel</a>
        </div>
    </form>
    <div id="uploadProgress" class="hidden mt-4">
        <div class="w-full h-2 rounded-full" style="background:rgba(0,0,0,0.3);">
            <div id="progressBar" class="h-2 rounded-full transition-all" style="background:linear-gradient(90deg,var(--accent2),var(--accent)); width:0%;"></div>
        </div>
        <div class="text-xs mt-1" id="progressText" style="color:var(--text-dim);">Uploading ...</div>
    </div>
</div>
<script>
let selectedFiles = [];
async function handleFiles(files) {
    const list = document.getElementById('fileList');
    for (let f of files) {
        selectedFiles.push(f);
        const div = document.createElement('div');
        div.className = 'flex items-center justify-between p-3 rounded-lg';
        div.style = 'background:rgba(0,0,0,0.2);';
        div.innerHTML = '<span class="text-sm truncate flex-1"><i class="fas fa-file mr-2" style="color:var(--accent);"></i>' + f.name + ' (' + (f.size/1024).toFixed(1) + ' KB)</span><i class="fas fa-check-circle" style="color:#4ade80;"></i>';
        list.appendChild(div);
    }
}
document.getElementById('uploadForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const dept = document.getElementById('deptSelect').value;
    const type = document.getElementById('typeSelect').value;
    if (!dept || !type) { alert('Please selectDepartment And Type'); return; }
    if (selectedFiles.length === 0) { alert('Please selectFile'); return; }

    const formData = new FormData();
    formData.append('department', dept);
    formData.append('file_type', type);
    selectedFiles.forEach(f => formData.append('files', f));

    document.getElementById('uploadProgress').classList.remove('hidden');
    document.getElementById('progressBar').style.width = '50%';
    document.getElementById('progressText').textContent = 'Uploading ...';

    try {
        const resp = await fetch('/upload', { 
            method: 'POST', 
            body: formData,
            // Not Settings Content-Type，Let browserAutoSettings multipart/form-data
        });
        const text = await resp.text();
        // CheckAre you sureBackHTML（MayLogin PageRedirectOrError Page）
        if (text.trim().startsWith('<') && (text.toLowerCase().includes('doctype') || text.includes('<html'))) {
            // Try fromHTMLIn ExtractErrorInformation
            const match = text.match(/<title>(.*?)<\/title>/i);
            const errorMsg = match ? match[1] : 'SessionAlreadyExpiredOrLoginFailed';
            alert('UploadFailed: ' + errorMsg + '，Please Re-NewLogin');
            location.href = '/login';
            return;
        }
        const data = JSON.parse(text);
        if (data.success) {
            document.getElementById('progressBar').style.width = '100%';
            document.getElementById('progressText').textContent = data.message;
            alert(data.message);
            location.href = '{{ url_for("files") }}';
        } else {
            alert(data.message);
        }
    } catch(err) {
        alert('UploadFailed: ' + err);
    }
});
// LoadingDepartment And TypeList
(async function() {
    try {
        const [depts, types] = await Promise.all([
            fetch('/api/departments').then(r => r.json()),
            fetch('/api/file-types').then(r => r.json())
        ]);
        const deptSel = document.getElementById('deptSelect');
        depts.forEach(d => { const opt = document.createElement('option'); opt.value = d.name; opt.textContent = d.name; deptSel.appendChild(opt); });
        const typeSel = document.getElementById('typeSelect');
        types.forEach(t => { const opt = document.createElement('option'); opt.value = t.name; opt.textContent = t.name; typeSel.appendChild(opt); });
    } catch(e) { console.error(e); }
})();
</script>
{% endblock %}
